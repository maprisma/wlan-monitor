[package]
name = "maprisma-wlan-monitor"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "COSMIC panel applet: who is on your Wi-Fi, in plain words"

[dependencies]
serde_json = "1"
# Already in the dependency tree (libcosmic): F12 screenshots (PNG, openat/fstat).
png = "0.18"
libc = "0.2"
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt", "rt-multi-thread", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[[bin]]
name = "maprisma-wlan-monitor-tray"
path = "src/tray/main.rs"

[dependencies.libcosmic]
# pop-os/libcosmic 95236a9 (what COSMIC's own applets 1.11 are built against) plus one fix:
# the window zoom reaches iced, so --window windows follow the desktop's text size (look.rs).
git = "https://github.com/maprisma/libcosmic"
rev = "40d534c5d5a463cc473e0c9f01ad2da068b11bcd"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]

[profile.release]
lto = "thin"
